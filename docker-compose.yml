version: '3'
services:
  frontend:
    build:
      context: ./frontend
    container_name: nabtura_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_STRAPI_URL=http://178.128.112.232
    ports:
      - "3000:3000"
    networks:
      - nabtura-network

  backend:
    build:
      context: ./backend
    container_name: nabtura_backend
    restart: always
    env_file: ./backend/.env
    environment:
      - DATABASE_CLIENT=mysql
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=nabtura_db
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - strapi-data:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - nabtura-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: nabtura_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nabtura_db
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - nabtura-network

  nginx:
    image: nginx:alpine
    container_name: nabtura_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nabtura-network
    depends_on:
      - frontend
      - backend

networks:
  nabtura-network:
    driver: bridge

volumes:
  strapi-data:
  mysql-data:
