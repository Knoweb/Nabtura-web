server {
    listen 80;
    server_name _;

    # Route /sanota-greenhouse to Sanota Greenhouse Live App (165.22.251.111)
    location = /sanota-greenhouse {
        return 301 /sanota-greenhouse/;
    }

    location ^~ /sanota-greenhouse/ {
        proxy_pass http://165.22.251.111/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host 165.22.251.111;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_cache_bypass $http_upgrade;

        sub_filter 'src="/assets/' 'src="/sanota-greenhouse/assets/';
        sub_filter 'href="/assets/' 'href="/sanota-greenhouse/assets/';
        sub_filter 'href="/favicon' 'href="/sanota-greenhouse/favicon';
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Route /assets/ to Sanota Greenhouse assets (Next.js uses /_next/)
    location ^~ /assets/ {
        proxy_pass http://165.22.251.111/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host 165.22.251.111;
        proxy_cache_bypass $http_upgrade;
    }

    # Route /api, /admin, /content-manager, /users-permissions to Strapi (Backend)
    location ~ ^/(api|admin|content-manager|users-permissions|i18n|upload|content-type-builder) {
        proxy_pass http://backend:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route /uploads to Strapi (Backend)
    location /uploads/ {
        proxy_pass http://backend:1337/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route everything else to Next.js (Frontend)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Optional direct subdomain mapping (e.g. greenhouse.nabtura.com)
server {
    listen 80;
    server_name greenhouse.nabtura.com sanota-greenhouse.nabtura.com;

    location / {
        proxy_pass http://165.22.251.111/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host 165.22.251.111;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
